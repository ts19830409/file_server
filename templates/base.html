{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{% static 'logo.png' %}" type="image/x-icon">
    <title>File Server</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <img id="header-avatar" src="{% static 'logo.png' %}" alt="Logo" style="height: 70px; margin-right: 5px;">
            <a class="navbar-brand fs-2 fw-bold" href="/files/">File Server</a>
            <div class="text-light mx-auto text-center" id="user-greeting">
                <span id="greeting-text"></span>
            </div>
            {% block navbar %}
            <div>
                <a class="btn btn-outline-light btn-sm" href="/files/">Мои файлы</a>
                <a class="btn btn-outline-light btn-sm" href="/profile/">Профиль</a>
                <a class="btn btn-outline-light btn-sm" href="/about/">О проекте</a>
                <form method="post" action="/logout/" style="display:inline;">
                {% csrf_token %}
                    <button type="submit" class="btn btn-outline-danger btn-sm">Выйти</button>
                </form>
            </div>
            {% endblock %}
        </div>
    </nav>
    
    
    <div class="container mt-4 flex-grow-1">
        {% block content %}{% endblock %}
    </div>
    <footer class="bg-dark text-light py-3 mt-auto">
        <div class="container text-center">
            <small>© 2026 File Server. Версия 2.0</small>
        </div>
    </footer>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    
    
    
    
</body>
</html>
